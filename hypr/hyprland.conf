source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf

# Sessie: wallpaper → vergrendelscherm (geen desktop zichtbaar tot ontgrendelen)
exec-once = bash -c 'S="$HOME/.config/big-sur/scripts/start-session.sh"; if [ -x "$S" ]; then exec "$S"; else hyprpaper & sleep 0.5 && exec hyprlock; fi'
# Waybar na korte pauze (start achter hyprlock); script valideert config-pad en logt crashes
exec-once = bash -c 'sleep 1; S="$HOME/.config/big-sur/scripts/start-waybar.sh"; if [ -x "$S" ]; then exec "$S"; else exec waybar; fi'
exec-once = dunst

monitor = ,preferred,auto,1

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }

    # Convertible (bijv. HP EliteBook x360): touchscreen + Waybar rotatie/toetsenbord;
    # zie README "HP EliteBook x360 / convertible laptops".
}
