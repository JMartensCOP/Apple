# Big Sur lock screen — installed to ~/.config/hypr/hyprlock.conf
# Wallpaper: assets/Lockscreen.jpg -> ~/.config/hypr/big-sur/Lockscreen.jpg

general {
    hide_cursor = true
    ignore_empty_input = false
}

auth {
    pam:enabled = true
}

background {
    monitor =
    path = ~/.config/hypr/big-sur/Lockscreen.jpg
    color = rgba(23, 23, 56, 1.0)
    blur_passes = 0
    brightness = 0.68
    contrast = 1.02
}

label {
    monitor =
    text = $TIME12
    color = rgba(245, 247, 250, 0.98)
    font_size = 96
    font_family = Inter
    position = 0, -48
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(216, 222, 233, 0.92)
    font_size = 28
    font_family = Inter
    position = 0, 56
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(245, 247, 250, 0.88)
    font_size = 22
    font_family = Inter
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    inner_color = rgba(23, 23, 56, 0.45)
    outer_color = rgba(245, 247, 250, 0.28)
    check_color = rgba(103, 199, 232, 0.85)
    fail_color = rgba(200, 58, 54, 0.85)
    font_color = rgba(245, 247, 250, 0.95)
    font_family = Inter
    fade_on_empty = true
    fade_timeout = 800
    rounding = 26
    dots_size = 0.22
    dots_spacing = 0.35
    placeholder_text = Enter Password
    fail_text = $FAIL ($ATTEMPTS)
    position = 0, 72
    halign = center
    valign = bottom
}
